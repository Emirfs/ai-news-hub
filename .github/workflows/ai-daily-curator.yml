name: AI Hourly News Curator

on:
  schedule:
    # Run twice an hour at offset minutes 17 and 47 to bypass top-of-the-hour GitHub queue delays
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      article_count:
        description: 'Maximum number of articles to curate'
        required: false
        default: '2'
        type: string
      dry_run:
        description: 'Simulate without committing files'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ai-news-curator
  cancel-in-progress: false
jobs:
  curate-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run autonomous news curator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-2.5-flash'
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          COUNT="${{ github.event.inputs.article_count || '2' }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          if ! [[ "$COUNT" =~ ^[1-9][0-9]?$ ]]; then
            echo "::error::article_count must be an integer from 1 to 99"
            exit 1
          fi

          CMD=(python pipeline/run_pipeline.py --mode daily --count "$COUNT")
          if [ "$DRY_RUN" = "true" ]; then
            CMD+=(--dry-run)
          fi

          printf 'Executing:'
          printf ' %q' "${CMD[@]}"
          printf '\n'
          "${CMD[@]}"

      - name: Commit and push new dispatches
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "NeuralPulseBot[bot]"
          git config --global user.email "neuralpulse-bot@users.noreply.github.com"
          git add src/content/news/ src/data/ pipeline/history.json README.md ARCHIVE.md

          if git diff --staged --quiet; then
            echo "No new dispatches to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore(news): publish autonomous AI dispatches [$TIMESTAMP] [skip ci]"
            git push origin main
          fi
