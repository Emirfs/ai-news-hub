name: AI Daily News Curator

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      article_count:
        description: 'Maximum number of articles to curate'
        required: false
        default: '3'
        type: string
      dry_run:
        description: 'Simulate without committing files'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  curate-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run autonomous news curator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-2.0-flash'
        run: |
          COUNT="${{ github.event.inputs.article_count || '3' }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          CMD="python pipeline/run_pipeline.py --mode daily --count $COUNT"
          if [ "$DRY_RUN" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          echo "Executing: $CMD"
          eval $CMD

      - name: Commit and push new dispatches
        run: |
          git config --global user.name "NeuralPulseBot[bot]"
          git config --global user.email "neuralpulse-bot@users.noreply.github.com"
          git add src/content/news/ pipeline/history.json

          if git diff --staged --quiet; then
            echo "No new dispatches to commit."
          else
            TODAY=$(date -u +"%Y-%m-%d")
            git commit -m "chore(news): publish autonomous AI dispatches [$TODAY] [skip ci]"
            git push origin main
          fi
