name: AI Weekly Intelligence Digest

on:
  schedule:
    # Run every Sunday at 18:00 UTC
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synthesize weekly intelligence briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-1.5-flash'
        run: |
          python pipeline/run_pipeline.py --mode weekly

      - name: Commit and push weekly briefing
        run: |
          git config --global user.name "NeuralPulseBot[bot]"
          git config --global user.email "neuralpulse-bot@users.noreply.github.com"
          git add src/content/news/ pipeline/history.json ARCHIVE.md

          if git diff --staged --quiet; then
            echo "No new weekly briefing to commit."
          else
            WEEK=$(date -u +"%W")
            git commit -m "chore(digest): publish executive weekly AI briefing [Week $WEEK] [skip ci]"
            git push origin main
          fi
